{# TELA DE LOGIN: envia usuário e senha para o app.py (rota /login) #}
{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block body %}
<div class="center"><form class="box" method="post">
  <h1>Entrar</h1>
  {# Código de segurança (campo escondido) #}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Usuário</label><input name="usuario" autocomplete="username" required autofocus>
  <label>Senha</label><input name="senha" type="password" autocomplete="current-password" required>
  <div class="row" style="margin-top:20px"><button class="p">Entrar</button><a class="btn" href="{{ url_for('index') }}">Voltar ao site</a></div>
</form></div>
{% endblock %}
